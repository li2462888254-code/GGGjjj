name: fund-monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # ????????? 10:15?UTC 02:15?
    - cron: '15 2 * * 1-5'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send fund alert
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: node monitor.mjs
